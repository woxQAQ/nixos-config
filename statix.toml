disabled = [
  # False positives
  "bool_comparison",
  "bool_simplification",
  # Too noisy with HM's flat `home.file.x.source` style; not worth fixing by hand.
  "repeated_keys",
  # Not actually deprecated
  "deprecated_is_null",
  "faster_groupby",
  "faster_zipattrswith",
]

ignore = [
  "*record_screen*",
  # Local build symlinks point into /nix/store; only the global gitignore knows
  # about `result-*`, which statix does not read.
  "result",
  "result-*",
  "*hardware-configuration.nix"
]
