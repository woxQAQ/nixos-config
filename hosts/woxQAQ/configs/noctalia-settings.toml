[plugin_settings."woxQAQ/stats"]
details_open_near_click = true
details_placement = "attached"
interval_seconds = 1
magpie-details_open_near_click = true
magpie-details_placement = "attached"
magpie_metrics_endpoint = "http://selfcloud.lan:8428"
magpie_window = "24h"

[plugins]
enabled = ["woxQAQ/stats"]

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[[plugins.source]]
kind = "git"
location = "https://github.com/woxQAQ/noctalia-stats.git"
name = "noctalia-stats"

[shell]
font_family = "Inter Noto Sans SC"
lang = "zh-Hans"
screen_time_enabled = true

[shell.screen_corners]
enabled = true

[shell.screenshot]
directory = "/home/woxQAQ/Pictures/Screenshots"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "auto"
sync_color_scheme = true

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "qt", "kcolorscheme"]

[wallpaper]
directory = "/home/woxQAQ/Pictures/Wallpapers"
fill_mode = "center"

[wallpaper.default]
path = "/home/woxQAQ/Pictures/Wallpapers/wallhaven-w53k9q.jpg"

[wallpaper.last]
path = "/home/woxQAQ/Pictures/Wallpapers/wallhaven-w53k9q.jpg"

[wallpaper.monitors.DP-3]
path = "/home/woxQAQ/Pictures/Wallpapers/wallhaven-w53k9q.jpg"

[widget.cpu_2]
display = "value"
type = "woxQAQ/stats:cpu"

[widget.disk]
path = "/"
stat = "disk_used_pct"
type = "sysmon"

[widget.disk_2]
capacity_display = "value"
display = "value"
type = "woxQAQ/stats:disk"

[widget.magpie]
display = "tokens"
type = "woxQAQ/stats:magpie"

[widget.memory]
display = "value"
type = "woxQAQ/stats:memory"

[widget.network]
show_label = false

[widget.network_2]
display = "value"
type = "woxQAQ/stats:network"

[widget.ram]
stat = "ram_pct"

[widget.workspaces]
active_pill_size = 2.0
