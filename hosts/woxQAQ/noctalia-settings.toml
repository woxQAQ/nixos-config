config_version = 16

[accessibility]
ui_scale = 1.0

[bar.default]
background_opacity = 0.65999998524785042
capsule = true
capsule_thickness = 0.78999998606741428
contact_shadow = true
end = [
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]
font_family = "Inter Noto Sans SC"
font_scale = 1.0999999828636646
margin_ends = 20
start = ["launcher", "wallpaper", "workspaces", "group:g1"]

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g1"
members = ["cpu", "ram", "disk", "network_tx", "network_rx", "temp"]
opacity = 1.0
padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = []

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget]

[dock]
reserve_space = false

[location]
address = "Quanzhou"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-3"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
box_height = 196.0
box_width = 810.0
cx = 1024.0
cy = 970.0
output = "DP-3"
placement_height = 1152.0
placement_width = 2048.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[nightlight]
force = true

[notification]
position = "bottom_right"

[osd]
position = "bottom_right"

[osd.kinds]
media = false

[plugins]
enabled = []

[shell]
font_family = "Inter Noto Sans SC"
lang = "zh-Hans"
screen_time_enabled = true

[shell.screenshot]
directory = "/home/woxQAQ/Pictures/Screenshots"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/woxQAQ/Pictures/Wallpapers"
fill_mode = "center"

[wallpaper.default]
path = "/home/woxQAQ/Pictures/Wallpapers/wallhaven-gw1y5e.jpg"

[wallpaper.last]
path = "/home/woxQAQ/Pictures/Wallpapers/wallhaven-gw1y5e.jpg"

[wallpaper.monitors.DP-3]
path = "/home/woxQAQ/Pictures/Wallpapers/wallhaven-gw1y5e.jpg"

[widget.ram]
stat = "ram_pct"

# disk is not a seeded instance (unlike ram/cpu), so type must be explicit;
# otherwise the parser treats "disk" itself as the widget type and drops it.
[widget.disk]
type = "sysmon"
stat = "disk_used_pct"
path = "/"
