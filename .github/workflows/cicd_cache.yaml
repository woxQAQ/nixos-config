name: Build binary cache
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source:
        description: Source package to build
        type: choice
        options: [all, helix, hidpipe]
        default: all
      revision:
        description: Full source commit SHA (empty uses flake.lock)
        type: string
        default: ""
jobs:
  build-cache:
    name: Cache on ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-darwin
            os: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup access to nix-secrets
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_SSH_KEY }}
      - name: Verify cache upload credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo "::error::Set the CACHIX_AUTH_TOKEN Actions secret to a token with write access to the woxqaq cache."
            exit 1
          fi
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            auto-optimise-store = true
            allow-import-from-derivation = false
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
            system = ${{ matrix.system }}
      - name: Compute grammar cache key
        if: inputs.source != 'hidpipe'
        id: grammar-cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_SOURCE: ${{ inputs.source || 'all' }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          helix_revision=$(jq -r '.nodes.helix.locked.rev' flake.lock)
          if [[ "$CACHE_SOURCE" == helix && -n "$SOURCE_REVISION" ]]; then
            helix_revision="$SOURCE_REVISION"
          fi
          grammar_hash=$(gh api --method GET repos/woxQAQ/helix/contents/languages.toml \
            --raw-field ref="$helix_revision" --jq '.sha')
          echo "hash=$grammar_hash" >> "$GITHUB_OUTPUT"
      - name: Cache public Nix source downloads
        if: inputs.source != 'hidpipe'
        uses: actions/cache@v4
        with:
          # The tarball cache contains GitHub source trees and can repopulate an empty store.
          # Keep the private nix-secrets checkout in gitv3 outside this cache.
          path: |
            ~/.cache/nix/tarball-cache*
            ~/.cache/nix/fetcher-cache*
          key: nix-fetch-v1-${{ matrix.system }}-${{ steps.grammar-cache.outputs.hash }}
          restore-keys: |
            nix-fetch-v1-${{ matrix.system }}-
      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: woxqaq
          authToken: "${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}"
      - name: Build source packages
        env:
          NIX_SYSTEM: ${{ matrix.system }}
          CACHE_SOURCE: ${{ inputs.source || 'all' }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          case "$CACHE_SOURCE" in
            all|helix|hidpipe) ;;
            *) echo "::error::Unsupported cache source: $CACHE_SOURCE"; exit 1 ;;
          esac
          nix_flags=(--no-update-lock-file)
          if [[ -n "$SOURCE_REVISION" ]]; then
            if [[ "$CACHE_SOURCE" == all || ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::A source revision must be a full commit SHA for helix or hidpipe."
              exit 1
            fi
            # Keep the host's dependency graph and overrides, replacing only the source revision.
            nix_flags=(--no-write-lock-file --override-input "$CACHE_SOURCE" \
              "github:woxQAQ/${CACHE_SOURCE}/${SOURCE_REVISION}")
          fi
          package_names=$(nix eval "${nix_flags[@]}" --raw \
            ".#packages.${NIX_SYSTEM}" \
            --apply 'packages: builtins.concatStringsSep "\n" (builtins.attrNames packages)')
          targets=()
          while IFS= read -r package; do
            case "$CACHE_SOURCE:$package" in
              all:*|helix:helix|hidpipe:hidpipe|hidpipe:hidpipe-openlogi)
                targets+=(".#packages.${NIX_SYSTEM}.${package}") ;;
            esac
          done <<< "$package_names"
          nix build --no-link --keep-going "${nix_flags[@]}" "${targets[@]}"
