name: Check
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  cicd-check:
    name: Build on ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-darwin
            os: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            auto-optimise-store = true
            allow-import-from-derivation = false
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
            system = ${{ matrix.system }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: woxqaq
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build development tools
        run: |
          nix build --no-link --no-update-lock-file \
            .#devShells.${{ matrix.system }}.default \
            .#formatter.${{ matrix.system }}
      - name: Validate hooks and run quality checks
        run: |
          nix develop --no-update-lock-file --command bash -euc '
            prek --version
            prek validate-config .pre-commit-config.yaml
            just check
          '
      - name: Evaluate host configurations
        if: matrix.system == 'x86_64-linux'
        run: |
          nix develop --no-update-lock-file --command just check-hosts
